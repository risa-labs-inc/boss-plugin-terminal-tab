name: Tests

# build.yml only fires on push to main and delegates to the release workflow,
# so nothing compiled this plugin before a merge landed. This runs on every
# pull request, which is what makes it usable as a required status check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

# Temporary stacked-PR validation. A draft may compile against the reviewed
# companion source; ready-for-review PRs and main MUST use the Maven dependency.
# Remove this path once BossTerm#434 is released and bosstermVersion is updated.
env:
  PAIRED_BOSSTERM: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.head_ref == 'feature/terminal-relay' }}

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.head_ref == 'feature/terminal-relay' && format('{0} (paired BossTerm source)', matrix.os) || (matrix.os == 'ubuntu-latest' && 'test' || 'windows-script-tests') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned companion for draft relay tests
        if: env.PAIRED_BOSSTERM == 'true'
        uses: actions/checkout@v4
        with:
          repository: kshivang/BossTerm
          # BossTerm#434. Pin source and its compatible Gradle wrapper together.
          ref: 36584ef3eae1c66ef7e3137a64559fa37c1198c3
          path: .paired-bossterm
          persist-credentials: false

      - name: Explain draft dependency validation
        if: env.PAIRED_BOSSTERM == 'true'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This draft tests against BossTerm#434 source at `36584ef3eae1c66ef7e3137a64559fa37c1198c3`.
          BossTerm 1.2.169 does not contain the relay/preferences interfaces. This is **not** a published-dependency release check.
          Before marking this PR ready, release the companion BossTerm change, update `bosstermVersion`, and review the guarded rendering/font overrides.
          Ready-for-review PRs and the release workflow continue building against the declared Maven artifact without source substitution.
          SUMMARY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The API is compileOnly at runtime because the host classloader provides
      # it, but compiling and testing happen outside the host, so the jar has to
      # be on the classpath here. Keep this literal pin aligned with build.yml
      # and the manifest; PluginManifestTest verifies that they agree.
      - name: Download boss-plugin-api
        env:
          API_VERSION: '1.0.89'
        run: |
          set -euo pipefail
          mkdir -p build/downloaded-deps
          # -f so an HTTP error is a failure rather than an error page silently
          # written to the jar path and a confusing compile error later.
          curl -fsSL -o build/downloaded-deps/boss-plugin-api.jar \
            "https://github.com/risa-labs-inc/boss-plugin-api/releases/download/v${API_VERSION}/boss-plugin-api-${API_VERSION}.jar"
          ls -l build/downloaded-deps/

      # fish, so SidebarEnvInjectionTest runs run_in_sidebar's env loader under a
      # real fish as well as sh, bash and zsh: fish quotes differently, and a
      # fish-only break would otherwise ship untested. pwsh is preinstalled.
      - name: Install fish and zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fish zsh

      # CI=true switches build.gradle.kts off the sibling-checkout jar and onto
      # the one downloaded above. Actions sets it anyway; set explicitly so the
      # dependency is visible rather than inherited.
      - name: Compile and run tests
        if: runner.os == 'Linux'
        # The setup lifecycle tests render a real terminal. Provide a display
        # on Linux and also validate the installable bundled artifact.
        run: |
          if [[ "$PAIRED_BOSSTERM" == "true" ]]; then
            xvfb-run -a ./.paired-bossterm/gradlew -p . test buildPluginJar --no-daemon \
              -PbosstermSourceDir="$GITHUB_WORKSPACE/.paired-bossterm"
          else
            xvfb-run -a ./gradlew test buildPluginJar --no-daemon
          fi
        env:
          CI: 'true'

      # Exercise generated scripts with actual Windows PowerShell 5.1. These
      # fixtures only run harmless commands; they never install packages.
      # SidebarEnvInjectionTest runs run_in_sidebar's env wrapper under the
      # Restricted execution policy, the default on Windows client editions.
      - name: Verify Windows scripts
        if: runner.os == 'Windows'
        run: |
          if [[ "$PAIRED_BOSSTERM" == "true" ]]; then
            ./.paired-bossterm/gradlew -p . test --tests '*HostAccountSessionBridgeTest' \
              --tests '*OnboardingInstallScriptTest' --tests '*PluginManifestTest' \
              --tests '*SidebarEnvInjectionTest' buildPluginJar --no-daemon \
              -PbosstermSourceDir="$GITHUB_WORKSPACE/.paired-bossterm"
          else
            ./gradlew test --tests '*HostAccountSessionBridgeTest' --tests '*OnboardingInstallScriptTest' \
              --tests '*PluginManifestTest' --tests '*SidebarEnvInjectionTest' buildPluginJar --no-daemon
          fi
        env:
          CI: 'true'
